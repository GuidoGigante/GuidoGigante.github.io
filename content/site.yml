# site.yml
# ---------------------------------------------------------------------------
# Everything global about the site. Edit freely; nothing here is load-bearing
# for the build except `name`.
# ---------------------------------------------------------------------------

name: Quantitative Health Models and Bioinspired Technologies
short_name: QUBIT Lab

# The one sentence at the top of the homepage. This is the most important
# line on the whole site. Keep it under about 20 words and say what you
# actually study, not what field you are in.
statement: >
  We build quantitative models to predict and track disease across all scales—from molecular kinetics to global spread.
#   Translating biological complexity into proactive health solutions, from molecular kinetics to the global spread of disease.

# One or two sentences of context directly under the statement.
intro: >
  Based at the Italian National Institute of Health (ISS), we combine explainable AI, high-dimensional time-series analysis, and sensor integration to turn complex biological signals into trustworthy clinical and epidemiological insights. 

institution: Istituto Superiore di Sanità (ISS)
address: Viale Regina Elena 299, 00161 Rome, Italy
email: guido.gigante@iss.it

# Shown in the footer. Delete any you do not use.
links:
  - label: GitHub (GG)
    url: https://github.com/GuidoGigante
  - label: GitHub (Pumazzo)
    url: https://github.com/pumazzo
  # - label: Google Scholar
    # url: https://scholar.google.com/citations?user=YOUR-ID
  # - label: LinkedIn
    # url: https://www.linkedin.com/in/YOUR-PROFILE

# Optional: a wide figure under the opening statement. A real image from
# your work is the single best thing you can put on this page. Put the file
# in static/img/ and name it here.
hero_image: hero_image.png
hero_image_alt: >
  A three-panel scientific plot comparing real and simulated data. The left and right panels show heatmaps of multi-unit neural activity over time, demonstrating a close match between the biological data and the model's simulation. The centre panel shows overlapping histograms of observed and predicted reaction times.
hero_caption: >
  From complex dynamics to emergent behavior: our generative models accurately predict macroscopic actions entirely from high-dimensional neural data.

# Single knob for the whole colour scheme. 
# Suggestion: A deep, trustworthy clinical blue/slate (#1F4E79) or tech-teal (#0E6E62).
accent: "#1F4E79"

# Names that should be bolded in the publication list, on top of everyone
# listed in team.yml (which is added automatically). Use this for former
# members and for name variants that appear on papers.
lab_authors:
  - Guido Gigante
  - Cristiano Capone
  - Andrea Ciardiello
  - Vittorio Dante

footer_note: >
  Site built from plain text files.
  [Source on GitHub](https://github.com/GuidoGigante/GuidoGigante.github.io).