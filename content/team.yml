# team.yml
# ---------------------------------------------------------------------------
# To add someone: copy a block, change the fields, commit. Order within a
# group is the order shown. Only `name` is required.
#
#   photo:  a file in static/img/. Leave it out and you get a tinted tile
#           with the person's initials, which looks fine — do not feel
#           obliged to chase people for headshots.
#   links:  any label you like (Website, GitHub, Scholar, ORCID, Bluesky).
# ---------------------------------------------------------------------------

groups:
  - title: Principal Investigator
    people:
      - name: Guido Gigante
        role: Head of Lab
        photo: gigante.png   # put the file in static/img/
        bio: >
          Physicist by training and former Chief Data Officer. Focuses on 
          extracting hidden, high-dimensional dynamics from complex biological data—spanning 
          from molecular kinetics (RT-QuIC) to epidemiological networks and population health.
        email: guido.gigante@iss.it
        links:
          - label: Scholar
            url: https://scholar.google.it/citations?user=s7SHhbIAAAAJ&hl=en&oi=ao
          - label: LinkedIn
            url: https://www.linkedin.com/in/guido-gigante-83210ba/
          - label: ORCID
            url: https://orcid.org/0000-0003-1899-4579

  - title: Researchers
    people:
      - name: Cristiano Capone
        role: Researcher
        photo: capone.png
        bio: >
          Bridges computational neuroscience and AI. Develops biologically plausible 
          learning rules, spiking neural networks, and advanced time-series models 
          for both adaptive control and predictive public health.
        links:
          - label: Scholar
            url: https://scholar.google.it/citations?user=wyHFdf4AAAAJ&hl=en&oi=ao
          - label: ORCID
            url: https://orcid.org/0000-0002-9958-2551
          # - label: GitHub
          #  url: https://github.com/his-profile

      - name: Andrea Ciardiello
        role: Researcher
        photo: ciardiello.png
        bio: >
          The lab's champion for trustworthy medical AI. Focuses on Explainable AI (XAI) 
          and computer vision, ensuring that algorithms used in diagnostic imaging and 
          clinical settings provide mathematically sound and clinically faithful reasoning.
        links:
          - label: ORCID
            url: https://orcid.org/0000-0003-1903-4406

  - title: Technical & Engineering Staff
    people:
      - name: Vittorio Dante
        role: Lead Technical Specialist
        # photo: dante.jpg
        bio: >
          The lab's anchor to the physical world. Designs custom embedded electronics 
          and hardware integrations, bridging the gap between software algorithms and 
          real-world sensor deployment (such as the MosAICo smart traps).
        # links:
          # - label: LinkedIn
            # url: https://www.linkedin.com/in/HIS-PROFILE

