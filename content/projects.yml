# projects.yml
# ---------------------------------------------------------------------------
# Research projects, shown in this order. `blurb` appears on the homepage,
# `body` only on the research page and accepts Markdown.
#
# `featured: true` puts it on the homepage. Two or three is plenty.
# ---------------------------------------------------------------------------

projects:
  - title: Smart Epidemiological Surveillance
    featured: true
    status: Ongoing
    blurb: >
      Leveraging AI, IoT sensors, and Graph Neural Networks to monitor vectors, 
      predict outbreaks, and reconstruct global pathogen-drug resistance networks.
    body: >
      We design advanced surveillance ecosystems that fuse diverse data streams to anticipate 
      public health threats. At the European level, we are part of the **GeoAI4EI** consortium 
      (2025–2029), where we are developing **DARDO**—a disease-agnostic prediction system that 
      forecasts respiratory outbreaks using Recurrent and Graph Neural Networks. 
      
      We also apply these advanced topological models to Antimicrobial Resistance (AMR) via our 
      **Mutagraph** framework, reconstructing global susceptibility networks to anticipate abrupt 
      shifts in pathogen-drug resistance. In the field, we integrate custom hardware and software 
      for automated disease vector recognition, such as the **MosAICo** smart traps.

      Funded by Horizon Europe (GeoAI4EI, 2025–2029).
    people: [Guido Gigante, Andrea Ciardiello]

  - title: Explainable AI (XAI) in Medical Imaging
    featured: true
    status: Ongoing
    blurb: >
      Building the metrological foundations for trustworthy AI by developing formal 
      verification frameworks, uncertainty quantification, and bias mitigation strategies.
    body: >
      To bridge the gap between complex algorithms and physician trust, we focus on the rigorous 
      assessment of Explainable AI. Through the ongoing **MAIBAI** project, we are developing a 
      metrological framework to ensure AI tools for diagnostic imaging—such as mammography—are 
      robust, fair, and clinically faithful. 
      
      This builds directly upon our foundational work in the **MUCCA** project, which explored 
      multidisciplinary use-cases in physics and medicine to highlight and overcome the weaknesses 
      of available "black box" XAI methods.

      Funded by the European Partnership on Metrology (MAIBAI, 2023–2026) and CHIST-ERA (MUCCA, 2021–2024).
    people: [Guido Gigante, Andrea Ciardiello]
    links:
      - label: MAIBAI Project Website
        url: https://www.maibaiproject.eu/
      - label: MUCCA Project Website
        url: https://mucca-project.github.io/

  - title: Digital Biomarkers & Kinetic Phenotyping
    featured: true
    status: Ongoing
    blurb: >
      Decoding dynamic physiological and molecular time-series to proactively 
      predict disease progression and risk.
    body: >
      We develop predictive machine-learning models that analyze dense, continuous data streams. 
      This spans from tracking human physiological states using wearable metabolic monitors to 
      analyzing the complex fluorescence trajectories of protein-amplification assays, such as 
      RT-QuIC for prion diseases. 
      
      By treating these signals as rich, multi-dimensional time trajectories rather than simple 
      binary snapshots, we uncover hidden kinetic phenotypes and dynamic biomarkers that can 
      predict clinical outcomes.
    people: [Guido Gigante, Gabriele D'Andrea, Cristiano Capone]

  - title: Bio-Inspired Adaptive Control
    featured: false
    status: Ongoing
    blurb: >
      Translating biological neural mechanisms into practical algorithms for robotics, 
      prosthetics, and autonomous systems.
    body: >
      We explore how mechanisms found in the brain—such as dendritic computation, gain modulation, 
      and multiple timescales—can inspire agile, low-power adaptation. We apply these theoretical 
      principles to spiking neural networks and neuromorphic hardware. This approach enables 
      artificial agents to learn and adapt to new goals in real-time with extreme sample efficiency.
    people: [Cristiano Capone, Guido Gigante]